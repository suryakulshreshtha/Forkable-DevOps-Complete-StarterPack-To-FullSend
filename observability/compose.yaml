# Local observability stack: the app, Prometheus and Grafana.
#   docker compose -f observability/compose.yaml up --build
# Ports are bound to 127.0.0.1 so nothing is exposed to your network.
#   App         http://127.0.0.1:8000
#   Prometheus  http://127.0.0.1:9090
#   Grafana     http://127.0.0.1:3000   (anonymous read-only viewer is enabled for the lab)
# Burn error budget on purpose:
#   CHAOS_ERROR_RATE=0.2 docker compose -f observability/compose.yaml up --build
name: fullsend-observability

services:
  app:
    build:
      context: ..
      args:
        GIT_SHA: local
    environment:
      APP_ENV: compose
      CHAOS_ERROR_RATE: ${CHAOS_ERROR_RATE:-0}
    ports:
      - "127.0.0.1:8000:8000"

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
