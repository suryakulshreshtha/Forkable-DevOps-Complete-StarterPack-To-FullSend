{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fullsend.fullname" . }}
  labels:
    {{- include "fullsend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fullsend.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
{{- end }}
