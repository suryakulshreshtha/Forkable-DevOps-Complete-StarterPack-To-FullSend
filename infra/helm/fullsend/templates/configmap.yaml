apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fullsend.fullname" . }}
  labels:
    {{- include "fullsend.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.app.environment | quote }}
  CHAOS_ERROR_RATE: {{ .Values.app.chaosErrorRate | quote }}
  OTEL_ENABLED: {{ .Values.app.otelEnabled | quote }}
