apiVersion: v1
kind: Service
metadata:
  name: {{ include "fullsend.fullname" . }}
  labels:
    {{- include "fullsend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "fullsend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
