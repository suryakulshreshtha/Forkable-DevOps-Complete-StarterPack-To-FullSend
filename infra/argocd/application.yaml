# Argo CD watches your fork and keeps the cluster matching the Helm chart in Git.
# Before applying: replace YOUR-GITHUB-USER below, and push an image to GHCR
# (the CI workflow does this on every push to main).
#   kubectl apply -n argocd -f infra/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullsend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-GITHUB-USER/Forkable-DevOps-Complete-StarterPack-To-FullSend.git
    targetRevision: main
    path: infra/helm/fullsend
    helm:
      valuesObject:
        image:
          repository: ghcr.io/your-github-user/fullsend   # GHCR names must be lowercase
          tag: latest
          pullPolicy: Always
        app:
          environment: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: fullsend-gitops
  syncPolicy:
    automated:
      prune: true      # delete what was removed from Git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
