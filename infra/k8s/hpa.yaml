# Scales on CPU. Needs the Kubernetes Metrics Server, which kind does not ship;
# on kind this object exists but reports "unknown" until Metrics Server is installed.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fullsend
  namespace: fullsend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fullsend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
