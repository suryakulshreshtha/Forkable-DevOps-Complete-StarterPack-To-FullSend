# Only HTTP on port 8000 may reach the pods; everything else inbound is denied.
# Enforcement needs NetworkPolicy support in the cluster network; kind has it out of
# the box since v0.24.0 (per its release notes). Other clusters: check your CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fullsend-ingress
  namespace: fullsend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fullsend
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
