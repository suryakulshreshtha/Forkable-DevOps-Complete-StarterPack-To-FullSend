# The namespace enforces the "restricted" Pod Security Standard: pods that run
# as root, add capabilities or allow privilege escalation are rejected.
apiVersion: v1
kind: Namespace
metadata:
  name: fullsend
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
