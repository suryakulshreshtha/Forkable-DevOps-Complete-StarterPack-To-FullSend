<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="t d">
  <title id="t">The delivery loop in this repository</title>
  <desc id="d">Eight stages in a figure-eight loop. Left loop, continuous integration: plan, code, build, test. Right loop, continuous delivery: release, deploy, operate, monitor. Each stage lists the tools this repository uses for it. Every change goes around the loop, and every incident feeds the next plan.</desc>
  <defs>
    <linearGradient id="ci" x1="0" x2="1">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#2bb07a"/>
    </linearGradient>
    <linearGradient id="cd" x1="0" x2="1">
      <stop offset="0" stop-color="#7cc4ff"/>
      <stop offset="1" stop-color="#4c9be0"/>
    </linearGradient>
    <style>
      .bg { fill: #0f1418; }
      .ring-ci { fill: none; stroke: url(#ci); stroke-width: 20; stroke-linecap: round; opacity: 0.9; }
      .ring-cd { fill: none; stroke: url(#cd); stroke-width: 20; stroke-linecap: round; opacity: 0.9; }
      .big { font: 700 44px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e7edf2; }
      .stage { font: 700 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e7edf2; }
      .num { font: 700 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f1418; }
      .tools { font: 12px ui-monospace, "SF Mono", Consolas, monospace; fill: #a9b8c4; }
      .card { fill: #161d23; stroke: #24303a; stroke-width: 1; }
      .dot-ci { fill: #3ddc97; }
      .dot-cd { fill: #7cc4ff; }
      .foot { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8a9aa8; }
    </style>
  </defs>

  <rect class="bg" width="960" height="450" rx="16"/>

  <!-- figure eight: two loops that cross in the middle -->
  <path class="ring-ci" d="M480,210 C420,120 330,110 290,110 C215,110 170,160 170,210 C170,260 215,310 290,310 C330,310 420,300 480,210"/>
  <path class="ring-cd" d="M480,210 C540,120 630,110 670,110 C745,110 790,160 790,210 C790,260 745,310 670,310 C630,310 540,300 480,210"/>
  <text class="big" x="248" y="226">CI</text>
  <text class="big" x="644" y="226">CD</text>

  <!-- CI stages (left loop) -->
  <rect class="card" x="16" y="20" width="214" height="62" rx="10"/>
  <circle class="dot-ci" cx="36" cy="43" r="9"/><text class="num" x="36" y="47" text-anchor="middle">1</text>
  <text class="stage" x="52" y="48">plan</text>
  <text class="tools" x="30" y="70">issues · PRs · rulesets</text>

  <rect class="card" x="240" y="20" width="214" height="62" rx="10"/>
  <circle class="dot-ci" cx="260" cy="43" r="9"/><text class="num" x="260" y="47" text-anchor="middle">2</text>
  <text class="stage" x="276" y="48">code</text>
  <text class="tools" x="254" y="70">git · Python 3.14 · Ruff</text>

  <rect class="card" x="240" y="338" width="214" height="62" rx="10"/>
  <circle class="dot-ci" cx="260" cy="361" r="9"/><text class="num" x="260" y="365" text-anchor="middle">3</text>
  <text class="stage" x="276" y="366">build</text>
  <text class="tools" x="254" y="388">Docker · multi-stage</text>

  <rect class="card" x="16" y="338" width="214" height="62" rx="10"/>
  <circle class="dot-ci" cx="36" cy="361" r="9"/><text class="num" x="36" y="365" text-anchor="middle">4</text>
  <text class="stage" x="52" y="366">test</text>
  <text class="tools" x="30" y="388">pytest · Playwright</text>

  <!-- CD stages (right loop) -->
  <rect class="card" x="506" y="20" width="214" height="62" rx="10"/>
  <circle class="dot-cd" cx="526" cy="43" r="9"/><text class="num" x="526" y="47" text-anchor="middle">5</text>
  <text class="stage" x="542" y="48">release</text>
  <text class="tools" x="520" y="70">Actions · Trivy · GHCR</text>

  <rect class="card" x="730" y="20" width="214" height="62" rx="10"/>
  <circle class="dot-cd" cx="750" cy="43" r="9"/><text class="num" x="750" y="47" text-anchor="middle">6</text>
  <text class="stage" x="766" y="48">deploy</text>
  <text class="tools" x="744" y="70">Helm · Argo CD</text>

  <rect class="card" x="730" y="338" width="214" height="62" rx="10"/>
  <circle class="dot-cd" cx="750" cy="361" r="9"/><text class="num" x="750" y="365" text-anchor="middle">7</text>
  <text class="stage" x="766" y="366">operate</text>
  <text class="tools" x="744" y="388">Kubernetes · Terraform</text>

  <rect class="card" x="506" y="338" width="214" height="62" rx="10"/>
  <circle class="dot-cd" cx="526" cy="361" r="9"/><text class="num" x="526" y="365" text-anchor="middle">8</text>
  <text class="stage" x="542" y="366">monitor</text>
  <text class="tools" x="520" y="388">Prometheus · Grafana · OTel</text>

  <text class="foot" x="480" y="432" text-anchor="middle">Every change goes around the loop. Every incident feeds the next plan.</text>
</svg>
