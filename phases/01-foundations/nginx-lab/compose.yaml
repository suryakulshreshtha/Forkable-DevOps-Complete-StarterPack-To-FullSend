# Reverse proxy + load balancer + cache lab (needs Docker, so do it after Phase 3 or now if
# Docker is already installed).
#   docker compose -f phases/01-foundations/nginx-lab/compose.yaml up --build -d
#   curl -si http://127.0.0.1:8080/api/v1/info        (macOS)
#   curl.exe -si http://127.0.0.1:8080/api/v1/info    (Windows PowerShell)
#   docker compose -f phases/01-foundations/nginx-lab/compose.yaml down
name: fullsend-nginx-lab

services:
  app1:
    build:
      context: ../../..
    environment:
      APP_ENV: backend-1
  app2:
    build:
      context: ../../..
    environment:
      APP_ENV: backend-2
  nginx:
    image: nginx:1.30.5
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
