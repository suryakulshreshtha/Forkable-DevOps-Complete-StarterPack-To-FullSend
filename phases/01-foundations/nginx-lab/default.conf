# Included inside the http {} block of the official image's nginx.conf.

# Combined format plus request time, the format log_report.py expects.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
access_log /dev/stdout timed;

# Two backends; Nginx round-robins between them by default.
upstream fullsend_backends {
    server app1:8000;
    server app2:8000;
}

# A small cache. Keys are request URIs; entries expire after 60s without use.
proxy_cache_path /var/cache/nginx/fullsend levels=1:2 keys_zone=fullsend:10m max_size=50m
                 inactive=60s use_temp_path=off;

server {
    listen 80;

    # Pass the client's details on, and tag every request with an ID the app will echo.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location / {
        proxy_pass http://fullsend_backends;
        add_header X-Upstream $upstream_addr always;
    }

    # Cache one read-only endpoint for 10 seconds to see a cache HIT and MISS.
    location = /api/v1/info {
        proxy_pass http://fullsend_backends;
        proxy_cache fullsend;
        proxy_cache_valid 200 10s;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Upstream $upstream_addr always;
    }
}
